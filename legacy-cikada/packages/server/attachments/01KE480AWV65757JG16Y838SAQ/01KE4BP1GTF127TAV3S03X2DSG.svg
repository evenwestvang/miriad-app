<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#ffeaa7"/>

  <!-- Pizza slice -->
  <path d="M 100 40 L 160 170 L 40 170 Z" fill="#f39c12"/>

  <!-- Crust -->
  <path d="M 40 170 L 160 170 Q 150 180 100 185 Q 50 180 40 170 Z" fill="#d68910"/>

  <!-- Cheese texture -->
  <ellipse cx="90" cy="120" rx="15" ry="12" fill="#f1c40f" opacity="0.6"/>
  <ellipse cx="110" cy="130" rx="12" ry="10" fill="#f1c40f" opacity="0.5"/>
  <ellipse cx="100" cy="100" rx="10" ry="8" fill="#f1c40f" opacity="0.7"/>

  <!-- Pepperoni -->
  <circle cx="80" cy="110" r="10" fill="#c0392b"/>
  <circle cx="85" cy="112" r="1.5" fill="#a93226" opacity="0.6"/>
  <circle cx="78" cy="108" r="1" fill="#a93226" opacity="0.6"/>

  <circle cx="120" cy="120" r="10" fill="#c0392b"/>
  <circle cx="123" cy="118" r="1.5" fill="#a93226" opacity="0.6"/>
  <circle cx="118" cy="122" r="1" fill="#a93226" opacity="0.6"/>

  <circle cx="100" cy="80" r="10" fill="#c0392b"/>
  <circle cx="102" cy="82" r="1.5" fill="#a93226" opacity="0.6"/>
  <circle cx="98" cy="79" r="1" fill="#a93226" opacity="0.6"/>

  <circle cx="95" cy="150" r="10" fill="#c0392b"/>
  <circle cx="97" cy="152" r="1.5" fill="#a93226" opacity="0.6"/>

  <circle cx="115" cy="155" r="10" fill="#c0392b"/>
  <circle cx="113" cy="153" r="1.5" fill="#a93226" opacity="0.6"/>

  <!-- Basil leaves -->
  <ellipse cx="105" cy="145" rx="8" ry="5" fill="#27ae60" transform="rotate(30 105 145)"/>
  <ellipse cx="85" cy="135" rx="7" ry="4" fill="#27ae60" transform="rotate(-20 85 135)"/>

  <!-- Steam -->
  <path d="M 70 60 Q 65 50 70 40" stroke="#95a5a6" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 100 50 Q 95 40 100 30" stroke="#95a5a6" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 130 60 Q 135 50 130 40" stroke="#95a5a6" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
