<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Stars background -->
  <rect width="200" height="200" fill="#1a1a2e"/>
  <circle cx="30" cy="30" r="2" fill="#ffffff"/>
  <circle cx="170" cy="40" r="1.5" fill="#ffffff"/>
  <circle cx="50" cy="180" r="1" fill="#ffffff"/>
  <circle cx="180" cy="170" r="2" fill="#ffffff"/>
  <circle cx="20" cy="120" r="1.5" fill="#ffffff"/>

  <!-- Rocket body -->
  <ellipse cx="100" cy="80" rx="20" ry="40" fill="url(#rocketGrad)"/>

  <!-- Rocket nose cone -->
  <path d="M 100 20 L 80 50 L 120 50 Z" fill="#95a5a6"/>

  <!-- Window -->
  <circle cx="100" cy="70" r="8" fill="#3498db"/>
  <circle cx="100" cy="70" r="5" fill="#2c3e50" opacity="0.3"/>

  <!-- Fins -->
  <path d="M 80 100 L 70 130 L 80 120 Z" fill="#34495e"/>
  <path d="M 120 100 L 130 130 L 120 120 Z" fill="#34495e"/>

  <!-- Flame -->
  <ellipse cx="100" cy="130" rx="15" ry="20" fill="#f39c12"/>
  <ellipse cx="100" cy="135" rx="10" ry="15" fill="#e67e22"/>
  <ellipse cx="100" cy="140" rx="6" ry="10" fill="#d35400"/>

  <!-- Smoke puffs -->
  <circle cx="95" cy="160" r="8" fill="#7f8c8d" opacity="0.4"/>
  <circle cx="105" cy="165" r="6" fill="#95a5a6" opacity="0.3"/>
  <circle cx="100" cy="175" r="5" fill="#bdc3c7" opacity="0.2"/>
</svg>
