AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cicada Agent Runtime - Durable agent execution with WebSocket streaming

Parameters:
  Stage:
    Type: String
    Default: prod

  AnthropicApiKeySecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the Anthropic API key

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs22.x
    Environment:
      Variables:
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        THREADS_TABLE: !Ref ThreadsTable
        THREAD_META_TABLE: !Ref ThreadMetaTable

Resources:
  # ============================================
  # DynamoDB Tables
  # ============================================

  # Connections Table - tracks WebSocket connections per thread
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: threadId
          AttributeType: S
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: threadId
          KeyType: HASH
        - AttributeName: connectionId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: connectionId-index
          KeySchema:
            - AttributeName: connectionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Threads Table - message history
  ThreadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-threads
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: threadId
          AttributeType: S
        - AttributeName: msgId
          AttributeType: S
      KeySchema:
        - AttributeName: threadId
          KeyType: HASH
        - AttributeName: msgId
          KeyType: RANGE

  # Thread Meta Table - execution state
  ThreadMetaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-thread-meta
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: threadId
          AttributeType: S
      KeySchema:
        - AttributeName: threadId
          KeyType: HASH

  # ============================================
  # WebSocket API
  # ============================================

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-websocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.request

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Stage
      AutoDeploy: true

  # Connect Route
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${ConnectIntegration}

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations

  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$connect

  # Disconnect Route
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${DisconnectIntegration}

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$disconnect

  # Sync Route
  SyncRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: sync
      AuthorizationType: NONE
      Target: !Sub integrations/${SyncIntegration}

  SyncIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyncFunction.Arn}/invocations

  SyncPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SyncFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/sync

  # ============================================
  # HTTP API
  # ============================================

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - "*"

  # ============================================
  # Lambda Functions
  # ============================================

  # Connect Function
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-connect
      Handler: index.connectHandler
      CodeUri: ./dist
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ConnectionsTable.Arn

  # Disconnect Function
  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-disconnect
      Handler: index.disconnectHandler
      CodeUri: ./dist
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub ${ConnectionsTable.Arn}/index/connectionId-index
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !GetAtt ConnectionsTable.Arn

  # Sync Function
  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-sync
      Handler: index.syncHandler
      CodeUri: ./dist
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Sub ${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt ConnectionsTable.Arn
                - !Sub ${ConnectionsTable.Arn}/index/connectionId-index
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt ThreadsTable.Arn
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Stage}/*

  # Start Thread Function
  StartThreadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-start-thread
      Handler: index.startThreadHandler
      CodeUri: ./dist
      Environment:
        Variables:
          AGENT_FUNCTION_NAME: !Ref AgentFunction
      Events:
        StartThread:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /thread
            Method: POST
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub ${AgentFunction.Arn}:*
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ThreadMetaTable.Arn

  # Send Message Function
  SendMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-send-message
      Handler: index.sendMessageHandler
      CodeUri: ./dist
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Sub ${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
          AGENT_FUNCTION_NAME: !Ref AgentFunction
      Events:
        SendMessage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /thread/{threadId}/message
            Method: POST
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ThreadsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ThreadMetaTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt ConnectionsTable.Arn
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Stage}/*
            - Effect: Allow
              Action:
                - lambda:SendDurableExecutionCallbackSuccess
              Resource:
                - !Sub ${AgentFunction.Arn}:*

  # Agent Durable Function
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-agent
      Handler: index.agentHandler
      CodeUri: ./dist
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Sub ${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
          ANTHROPIC_API_KEY: !Sub '{{resolve:secretsmanager:${AnthropicApiKeySecretArn}:SecretString:api_key}}'
      DurableConfig:
        ExecutionTimeout: 86400
        RetentionPeriodInDays: 7
      AutoPublishAlias: live
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:CheckpointDurableExecutions
                - lambda:GetDurableExecution
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-agent:*
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt ThreadsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ThreadMetaTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt ConnectionsTable.Arn
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Stage}/*

Outputs:
  WebSocketEndpoint:
    Description: WebSocket endpoint for Tymbal streaming
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  HttpApiEndpoint:
    Description: HTTP API endpoint
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  ConnectionsTableName:
    Description: DynamoDB table for connections
    Value: !Ref ConnectionsTable

  ThreadsTableName:
    Description: DynamoDB table for thread messages
    Value: !Ref ThreadsTable

  ThreadMetaTableName:
    Description: DynamoDB table for thread metadata
    Value: !Ref ThreadMetaTable
