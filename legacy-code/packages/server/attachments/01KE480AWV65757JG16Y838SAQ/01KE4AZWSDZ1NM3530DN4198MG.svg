<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#87CEEB"/>

  <!-- Head -->
  <circle cx="100" cy="80" r="35" fill="#FFD4A3"/>

  <!-- Sunglasses -->
  <rect x="75" y="70" width="20" height="12" rx="3" fill="#1a1a1a"/>
  <rect x="105" y="70" width="20" height="12" rx="3" fill="#1a1a1a"/>
  <line x1="95" y1="76" x2="105" y2="76" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Cool hair -->
  <path d="M 70 55 Q 75 40 85 45 Q 90 35 100 40 Q 110 35 115 45 Q 125 40 130 55 L 125 60 Q 115 50 100 55 Q 85 50 75 60 Z" fill="#2C1810"/>

  <!-- Smile -->
  <path d="M 85 95 Q 100 103 115 95" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Body (t-shirt) -->
  <rect x="70" y="115" width="60" height="50" rx="5" fill="#FF6B6B"/>

  <!-- Arms doing finger guns -->
  <g id="left-arm">
    <rect x="45" y="120" width="25" height="10" rx="5" fill="#FFD4A3"/>
    <!-- Finger gun hand -->
    <circle cx="45" cy="125" r="6" fill="#FFD4A3"/>
    <rect x="35" y="122" width="12" height="3" fill="#FFD4A3"/>
    <rect x="37" y="117" width="3" height="6" fill="#FFD4A3"/>
  </g>

  <g id="right-arm">
    <rect x="130" y="120" width="25" height="10" rx="5" fill="#FFD4A3"/>
    <!-- Finger gun hand -->
    <circle cx="155" cy="125" r="6" fill="#FFD4A3"/>
    <rect x="153" y="122" width="12" height="3" fill="#FFD4A3"/>
    <rect x="160" y="117" width="3" height="6" fill="#FFD4A3"/>
  </g>

  <!-- Sparkles for extra cool factor -->
  <text x="30" y="50" font-size="20" fill="#FFD700">✨</text>
  <text x="160" y="50" font-size="20" fill="#FFD700">✨</text>
  <text x="45" y="180" font-size="20" fill="#FFD700">✨</text>
  <text x="150" y="180" font-size="20" fill="#FFD700">✨</text>

  <!-- Cool text -->
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">COOL DUDE</text>
</svg>
