# Deploy to Staging - Runs on push to main
#
# Deploys all components:
# - Backend API → AWS Lambda (SAM)
# - Frontend → Vercel
# - Agent Container → Fly.io Registry (amd64)
#
# Fly.io is now the container runtime (replacing ECS/Fargate).

name: Deploy Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  backend:
    name: Backend API
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - name: Install and build
        working-directory: backend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build Lambda bundle
        working-directory: backend/deploy
        run: node build.mjs
      - name: SAM Build and Deploy
        working-directory: backend/deploy
        run: |
          sam build
          sam deploy \
            --stack-name cast-backend-stag \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --s3-prefix cast-backend \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides \
              Stage=stag \
              PlanetScaleUrl="${{ secrets.STAGING_PLANETSCALE_URL }}" \
              AnthropicApiKey="${{ secrets.STAGING_ANTHROPIC_API_KEY }}" \
              JwtSecret="${{ secrets.STAGING_JWT_SECRET }}" \
              SecretKey="${{ secrets.STAGING_SECRET_KEY }}" \
              AuthMode=workos \
              WorkOsApiKey="${{ secrets.STAGING_WORKOS_API_KEY }}" \
              WorkOsClientId="${{ secrets.STAGING_WORKOS_CLIENT_ID }}" \
              WorkOsRedirectUri="https://api.staging.caststack.ai/auth/callback" \
              FrontendUrl="https://app.staging.caststack.ai" \
              CastApiUrl="https://api.staging.caststack.ai" \
              GitHubClientId="${{ secrets.STAGING_GITHUB_CLIENT_ID }}" \
              GitHubClientSecret="${{ secrets.STAGING_GITHUB_CLIENT_SECRET }}" \
              TunnelServerUrl="https://tunnel.staging.caststack.site" \
              SubnetIds="${{ secrets.STAGING_SUBNET_IDS }}" \
              SecurityGroupIds="${{ secrets.STAGING_SECURITY_GROUP_IDS }}" \
              AgentImageUri="registry.fly.io/${{ secrets.STAGING_FLY_APP_NAME }}:latest"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: npm install -g vercel
      - name: Pull Vercel Environment
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build and Deploy
        working-directory: frontend
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_BACKEND_URL: https://api.staging.caststack.ai
          VITE_WS_URL: wss://ws.staging.caststack.ai
          VITE_AUTH_MODE: workos

  container:
    name: Agent Container (Fly.io)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Fly CLI
        run: curl -L https://fly.io/install.sh | sh && echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Authenticate with Fly
        run: ~/.fly/bin/fly auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.STAGING_FLY_API_TOKEN }}

      - name: Build TypeScript
        working-directory: agents/sandbox
        run: npm ci && npm run build

      - uses: docker/setup-buildx-action@v3

      # Build and push to Fly.io registry (MUST be linux/amd64 for Fly Machines)
      - uses: docker/build-push-action@v5
        with:
          context: agents/sandbox
          platforms: linux/amd64
          push: true
          tags: |
            registry.fly.io/${{ secrets.STAGING_FLY_APP_NAME }}:latest
            registry.fly.io/${{ secrets.STAGING_FLY_APP_NAME }}:sha-${{ github.sha }}
            registry.fly.io/${{ secrets.STAGING_FLY_APP_NAME }}:stag-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, container]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | ${{ needs.backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent Container (Fly.io) | ${{ needs.container.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Staging URL:** https://app.staging.caststack.ai" >> $GITHUB_STEP_SUMMARY
          echo "**Container:** registry.fly.io/${{ secrets.STAGING_FLY_APP_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
