# Deploy to Production - Manual trigger with confirmation
#
# Deploys all components:
# - Backend API → AWS Lambda (SAM)
# - Frontend → Vercel
# - Agent Container → Fly.io Registry (amd64)
# - Tunnel Server → AWS Fargate (arm64)
#
# Fly.io is now the container runtime for agents (replacing ECS/Fargate).

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        if: github.event.inputs.confirm != 'deploy-prod'
        run: |
          echo "::error::You must type 'deploy-prod' to confirm."
          exit 1

  backend:
    name: Backend API
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - working-directory: backend
        run: pnpm install --frozen-lockfile && pnpm build
      - working-directory: backend/deploy
        run: node build.mjs && sam build
      - working-directory: backend/deploy
        run: |
          sam deploy \
            --stack-name cast-backend-prod \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --s3-prefix cast-backend \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides \
              Stage=prod \
              PlanetScaleUrl="${{ secrets.PROD_PLANETSCALE_URL }}" \
              AnthropicApiKey="${{ secrets.PROD_ANTHROPIC_API_KEY }}" \
              JwtSecret="${{ secrets.PROD_JWT_SECRET }}" \
              SecretKey="${{ secrets.PROD_SECRET_KEY }}" \
              AuthMode=workos \
              WorkOsApiKey="${{ secrets.PROD_WORKOS_API_KEY }}" \
              WorkOsClientId="${{ secrets.PROD_WORKOS_CLIENT_ID }}" \
              WorkOsRedirectUri="${{ secrets.PROD_WORKOS_REDIRECT_URI }}" \
              FrontendUrl="${{ secrets.PROD_FRONTEND_URL }}" \
              CastApiUrl="${{ secrets.PROD_CAST_API_URL }}" \
              GitHubClientId="${{ secrets.PROD_GITHUB_CLIENT_ID }}" \
              GitHubClientSecret="${{ secrets.PROD_GITHUB_CLIENT_SECRET }}" \
              TunnelServerUrl="${{ secrets.PROD_TUNNEL_SERVER_URL }}" \
              SubnetIds="${{ secrets.PROD_SUBNET_IDS }}" \
              SecurityGroupIds="${{ secrets.PROD_SECURITY_GROUP_IDS }}" \
              AgentImageUri="registry.fly.io/${{ secrets.PROD_FLY_APP_NAME }}:latest"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: npm install -g vercel
      - working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - working-directory: frontend
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_BACKEND_URL: ${{ secrets.PROD_CAST_API_URL }}
          VITE_WS_URL: ${{ secrets.PROD_WS_URL }}
          VITE_AUTH_MODE: workos

  container:
    name: Agent Container (Fly.io)
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Fly CLI
        run: curl -L https://fly.io/install.sh | sh && echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Authenticate with Fly
        run: ~/.fly/bin/fly auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.PROD_FLY_API_TOKEN }}

      - name: Build TypeScript
        working-directory: agents/sandbox
        run: npm ci && npm run build

      - uses: docker/setup-buildx-action@v3

      # Build and push to Fly.io registry (MUST be linux/amd64 for Fly Machines)
      - uses: docker/build-push-action@v5
        with:
          context: agents/sandbox
          platforms: linux/amd64
          push: true
          tags: |
            registry.fly.io/${{ secrets.PROD_FLY_APP_NAME }}:latest
            registry.fly.io/${{ secrets.PROD_FLY_APP_NAME }}:sha-${{ github.sha }}
            registry.fly.io/${{ secrets.PROD_FLY_APP_NAME }}:prod-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tunnel:
    name: Tunnel Server
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: backend/packages/tunnel-server
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/cast-tunnel-server:prod-latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/cast-tunnel-server:prod-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          aws cloudformation deploy \
            --template-file backend/deploy/tunnel/template.yaml \
            --stack-name cast-tunnel-prod \
            --parameter-overrides \
              Stage=prod \
              VpcId="${{ secrets.PROD_VPC_ID }}" \
              SubnetIds="${{ secrets.PROD_SUBNET_IDS }}" \
              CertificateArn="${{ secrets.PROD_CERT_ARN }}" \
              HostedZoneId="${{ secrets.PROD_HOSTED_ZONE_ID }}" \
              TunnelDomain="cast-stack.site" \
              ContainerSecret="${{ secrets.PROD_CONTAINER_SECRET }}" \
              RatholeImage="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/cast-tunnel-server:prod-${{ github.run_number }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  tag:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [backend, frontend, container, tunnel]
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG="prod-$(date +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag: $TAG" >> $GITHUB_STEP_SUMMARY

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, container, tunnel, tag]
    if: always()
    steps:
      - run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container (Fly.io) | ${{ needs.container.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tunnel | ${{ needs.tunnel.result }} |" >> $GITHUB_STEP_SUMMARY
