# SAM CLI Configuration for Cast Tunnel Server
#
# NOTE: The preferred deployment method is using backend/scripts/deploy-tunnel.sh
# which auto-discovers infrastructure IDs. This samconfig is kept as reference.
#
# Deploy: sam deploy --config-env tunnel-stag --template-file template.yaml

version = 0.1

[default.global.parameters]
stack_name = "cast-tunnel"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

# =============================================================================
# tunnel-stag: Staging environment
# Usage: sam deploy --config-env tunnel-stag --template-file template.yaml
#
# PREFERRED: Use backend/scripts/deploy-tunnel.sh stag instead
# =============================================================================

[tunnel-stag.global.parameters]
stack_name = "cast-tunnel-stag"

[tunnel-stag.deploy.parameters]
profile = "cikada-stag"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "cast-tunnel"
region = "us-east-1"
disable_rollback = false
# Staging infrastructure IDs - last verified 2026-01-08
parameter_overrides = [
    "Stage=stag",
    # VPC and networking (account 455626925815)
    "VpcId=vpc-0cddcd4252755eb3d",
    "SubnetIds=subnet-0873ce7dc641901f6,subnet-0ecf88ad31694eb5e",
    # TLS certificate - wildcard for *.staging.cast-stack.site
    "CertificateArn=arn:aws:acm:us-east-1:455626925815:certificate/8f78b02a-b50d-462a-8cb1-4094ee3cefd1",
    # Route53 hosted zone for cast-stack.site
    "HostedZoneId=Z09693013171B0WCJNAMI",
    # Container secret - matches docker-orchestrator.ts dev fallback
    "ContainerSecret=cast-dev-container-secret-do-not-use-in-production",
    # Tunnel domain
    "TunnelDomain=staging.cast-stack.site",
    # Rathole image - will be built and pushed to ECR
    "RatholeImage=455626925815.dkr.ecr.us-east-1.amazonaws.com/cast-tunnel-server:stag-latest"
]

# =============================================================================
# tunnel-prod: Production environment
# Usage: sam deploy --config-env tunnel-prod --template-file template.yaml
# =============================================================================

[tunnel-prod.global.parameters]
stack_name = "cast-tunnel-prod"

[tunnel-prod.deploy.parameters]
profile = "cikada-prod"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "cast-tunnel"
region = "us-east-1"
disable_rollback = false
parameter_overrides = [
    "Stage=prod",
    "VpcId=vpc-XXXXXXXX",
    "SubnetIds=subnet-XXXXXXXX",
    "CertificateArn=arn:aws:acm:us-east-1:XXXXXXXXXXXX:certificate/XXXXXXXX",
    "HostedZoneId=ZXXXXXXXXXX",
    "ContainerSecret=XXXXXXXX",
    "RatholeImage=XXXXXXXXXXXX.dkr.ecr.us-east-1.amazonaws.com/cast-tunnel:latest"
]
