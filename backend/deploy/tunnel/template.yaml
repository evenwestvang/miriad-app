AWSTemplateFormatVersion: '2010-09-09'
Description: Cast Tunnel Server - Rathole reverse proxy for container HTTP access

Parameters:
  Stage:
    Type: String
    Default: stag
    AllowedValues:
      - stag
      - prod

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the tunnel server

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnet IDs for ALB and ECS tasks (need internet access)

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for wildcard domain

  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID for the domain

  TunnelDomain:
    Type: String
    Description: Wildcard domain for tunnel access (e.g., staging.cast-stack.site)
    Default: staging.cast-stack.site

  ContainerSecret:
    Type: String
    Description: CAST_CONTAINER_SECRET for validating container tokens
    NoEcho: true

  RatholeImage:
    Type: String
    Description: ECR URI for the rathole server image
    Default: ''

Resources:
  # =============================================================================
  # Security Groups
  # =============================================================================

  # ALB Security Group - accepts traffic from internet
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub cast-tunnel-alb-${Stage}
      GroupDescription: Security group for tunnel ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # HTTPS from anywhere
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        # HTTP for redirect (optional)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub cast-tunnel-alb-${Stage}
        - Key: Environment
          Value: !Ref Stage

  # ECS Security Group - accepts traffic from ALB and container tunnels
  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub cast-tunnel-ecs-${Stage}
      GroupDescription: Security group for tunnel ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # Hono proxy port (ALB target for user traffic)
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        # Rathole control port (containers connect here from anywhere)
        - IpProtocol: tcp
          FromPort: 2333
          ToPort: 2333
          CidrIp: 0.0.0.0/0
        # Dynamic service ports for tunneled traffic (internal only)
        - IpProtocol: tcp
          FromPort: 10000
          ToPort: 20000
          CidrIp: 127.0.0.1/32
      SecurityGroupEgress:
        # Allow all outbound (for health checks, etc.)
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub cast-tunnel-ecs-${Stage}
        - Key: Environment
          Value: !Ref Stage

  # =============================================================================
  # Application Load Balancer
  # =============================================================================

  TunnelALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub cast-tunnel-${Stage}
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Environment
          Value: !Ref Stage

  # HTTPS Listener with wildcard cert
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref TunnelALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TunnelTargetGroup

  # HTTP to HTTPS redirect
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref TunnelALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  # Target group for Hono proxy (handles health checks and routing)
  TunnelTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub cast-tunnel-${Stage}
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Stage

  # =============================================================================
  # Network Load Balancer (for rathole TCP control port)
  # =============================================================================

  # NLB for TCP traffic - rathole control connections from containers
  TunnelNLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub cast-tunnel-nlb-${Stage}
      Type: network
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      Tags:
        - Key: Environment
          Value: !Ref Stage

  # TCP Listener on port 2333 for rathole control connections
  NlbTcpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref TunnelNLB
      Port: 2333
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NlbTargetGroup

  # Target group for rathole control port
  NlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub cast-tunnel-tcp-${Stage}
      VpcId: !Ref VpcId
      Port: 2333
      Protocol: TCP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: TCP
      HealthCheckPort: '2333'
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Stage

  # =============================================================================
  # Route53 DNS
  # =============================================================================

  # DNS record for tunnel server (ALB - HTTP/HTTPS traffic)
  TunnelDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'tunnel.${TunnelDomain}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt TunnelALB.DNSName
        HostedZoneId: !GetAtt TunnelALB.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  # DNS record for NLB (TCP traffic - rathole control port 2333)
  # Containers connect to this domain on port 2333 for tunnel establishment
  TunnelTcpDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'tunnel-tcp.${TunnelDomain}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt TunnelNLB.DNSName
        HostedZoneId: !GetAtt TunnelNLB.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  # Wildcard DNS record pointing to ALB
  WildcardDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '*.${TunnelDomain}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt TunnelALB.DNSName
        HostedZoneId: !GetAtt TunnelALB.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  # =============================================================================
  # ECS Cluster & Service
  # =============================================================================

  # Dedicated cluster for tunnel server (separate from agent cluster)
  TunnelCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub cast-tunnel-${Stage}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Environment
          Value: !Ref Stage

  # CloudWatch Log Group
  TunnelLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/cast-tunnel-${Stage}
      RetentionInDays: 14

  # ECS Task Execution Role
  TunnelTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cast-tunnel-execution-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ECS Task Role (runtime permissions)
  TunnelTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cast-tunnel-task-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TunnelPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Allow writing logs
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt TunnelLogGroup.Arn

  # ECS Task Definition for tunnel server (Hono proxy + rathole)
  TunnelTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub cast-tunnel-${Stage}
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt TunnelTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TunnelTaskRole.Arn
      ContainerDefinitions:
        - Name: tunnel-server
          Image: !Ref RatholeImage
          Essential: true
          PortMappings:
            # Hono proxy port (ALB target)
            - ContainerPort: 8080
              Protocol: tcp
            # Rathole control port (containers connect here)
            - ContainerPort: 2333
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '8080'
            - Name: RATHOLE_CONTROL_PORT
              Value: '2333'
            - Name: RATHOLE_CONTROL_HOST
              Value: !Sub 'tunnel-tcp.${TunnelDomain}'
            - Name: RATHOLE_CONFIG_DIR
              Value: /etc/rathole
            - Name: BASE_SERVICE_PORT
              Value: '10000'
            - Name: CAST_CONTAINER_SECRET
              Value: !Ref ContainerSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref TunnelLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: tunnel
      Tags:
        - Key: Environment
          Value: !Ref Stage

  # ECS Service - always running
  TunnelService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
      - NlbTcpListener
    Properties:
      ServiceName: !Sub cast-tunnel-${Stage}
      Cluster: !Ref TunnelCluster
      TaskDefinition: !Ref TunnelTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref EcsSecurityGroup
      LoadBalancers:
        # ALB target group for HTTP/HTTPS traffic (Hono proxy)
        - ContainerName: tunnel-server
          ContainerPort: 8080
          TargetGroupArn: !Ref TunnelTargetGroup
        # NLB target group for TCP traffic (rathole control)
        - ContainerName: tunnel-server
          ContainerPort: 2333
          TargetGroupArn: !Ref NlbTargetGroup
      # Enable circuit breaker for deployment safety
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      Tags:
        - Key: Environment
          Value: !Ref Stage

Outputs:
  TunnelAlbDnsName:
    Description: ALB DNS name for tunnel server (HTTPS traffic)
    Value: !GetAtt TunnelALB.DNSName

  TunnelNlbDnsName:
    Description: NLB DNS name for rathole control port (TCP 2333)
    Value: !GetAtt TunnelNLB.DNSName

  TunnelAlbArn:
    Description: ALB ARN
    Value: !Ref TunnelALB

  TunnelNlbArn:
    Description: NLB ARN
    Value: !Ref TunnelNLB

  TunnelClusterArn:
    Description: ECS Cluster ARN for tunnel server
    Value: !GetAtt TunnelCluster.Arn

  TunnelServiceArn:
    Description: ECS Service ARN
    Value: !Ref TunnelService

  WildcardDomain:
    Description: Wildcard domain for container tunnels
    Value: !Sub '*.${TunnelDomain}'

  TunnelServerUrl:
    Description: Tunnel server URL for container registration (HTTPS)
    Value: !Sub 'https://tunnel.${TunnelDomain}'

  TunnelControlEndpoint:
    Description: Rathole control endpoint for containers (TCP)
    Value: !Sub 'tunnel-tcp.${TunnelDomain}:2333'
