AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cast Backend - Multi-agent collaboration platform

Parameters:
  Stage:
    Type: String
    Default: stag
    AllowedValues:
      - stag
      - prod
  PlanetScaleUrl:
    Type: String
    Description: PlanetScale PostgreSQL connection URL
    NoEcho: true
  AuthMode:
    Type: String
    Default: workos
    AllowedValues:
      - dev
      - workos
    Description: Authentication mode (dev for local testing, workos for production)
  WorkOsApiKey:
    Type: String
    Description: WorkOS API key
    NoEcho: true
    Default: ''
  WorkOsClientId:
    Type: String
    Description: WorkOS client ID
    Default: ''
  WorkOsRedirectUri:
    Type: String
    Description: WorkOS OAuth redirect URI
    Default: ''
  JwtSecret:
    Type: String
    Description: Secret key for signing session JWTs
    NoEcho: true
  AnthropicApiKey:
    Type: String
    Description: Anthropic API key for agent containers
    NoEcho: true
  AgentImageUri:
    Type: String
    Description: ECR URI for the agent container image
    Default: ''
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for Fargate tasks (must have internet access)
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group IDs for Fargate tasks (allow outbound HTTPS)
  CastApiUrl:
    Type: String
    Description: HTTP API URL for agent containers to call back (e.g., https://api.staging.clanker.is)
    Default: ''
  FrontendUrl:
    Type: String
    Description: Frontend URL for OAuth redirects (e.g., https://staging.clanker.is)
    Default: 'http://localhost:5173'
  SecretKey:
    Type: String
    Description: Secret key for encrypting user secrets in the database
    NoEcho: true
  GitHubClientId:
    Type: String
    Description: GitHub OAuth app client ID
    Default: ''
  GitHubClientSecret:
    Type: String
    Description: GitHub OAuth app client secret
    NoEcho: true
    Default: ''
  TunnelServerUrl:
    Type: String
    Description: Tunnel server URL for container HTTP access (e.g., https://tunnel.staging.cast-stack.site)
    Default: ''

Globals:
  Function:
    Timeout: 120
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Environment:
      Variables:
        STAGE: !Ref Stage
        NODE_OPTIONS: --enable-source-maps
        PLANETSCALE_URL: !Ref PlanetScaleUrl
        AUTH_MODE: !Ref AuthMode
        JWT_SECRET: !Ref JwtSecret

Resources:
  # Main API Lambda
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cast-backend-api-${Stage}
      Handler: lambda.handler
      CodeUri: dist/
      Description: Cast Backend API
      Role: !GetAtt ApiFunctionRole.Arn
      Environment:
        Variables:
          ECS_CLUSTER_ARN: !GetAtt AgentCluster.Arn
          ECS_TASK_DEFINITION: !Ref AgentTaskDefinition
          CONTAINER_STATE_TABLE: !Ref ContainerStateTable
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WEBSOCKET_ENDPOINT: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          SUBNET_IDS: !Join [',', !Ref SubnetIds]
          SECURITY_GROUP_IDS: !Join [',', !Ref SecurityGroupIds]
          CAST_API_URL: !Ref CastApiUrl
          WORKOS_API_KEY: !Ref WorkOsApiKey
          WORKOS_CLIENT_ID: !Ref WorkOsClientId
          WORKOS_REDIRECT_URI: !Ref WorkOsRedirectUri
          FRONTEND_URL: !Ref FrontendUrl
          SECRET_KEY: !Ref SecretKey
          GITHUB_CLIENT_ID: !Ref GitHubClientId
          GITHUB_CLIENT_SECRET: !Ref GitHubClientSecret
          TUNNEL_SERVER_URL: !Ref TunnelServerUrl
      Events:
        RootPath:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref HttpApi
        ProxyPath:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref HttpApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Format: esm
        Sourcemap: true
        EntryPoints:
          - lambda.mjs
        OutExtension:
          - .js=.mjs

  # HTTP API Gateway
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - 'http://localhost:3000'
          - 'http://localhost:3232'
          - 'http://localhost:5173'
          - 'https://staging.clanker.is'
          - 'https://clanker.is'
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowCredentials: true

  # =============================================================================
  # DynamoDB Tables
  # =============================================================================

  # Container state table - tracks Fargate task state for each agent thread
  ContainerStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cast-container-state-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: threadId
          AttributeType: S
      KeySchema:
        - AttributeName: threadId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Stage

  # WebSocket connections table - tracks API Gateway WebSocket connections
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cast-connections-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: channelId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ChannelIndex
          KeySchema:
            - AttributeName: channelId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Stage

  # =============================================================================
  # ECS Cluster & Task Definition
  # =============================================================================

  # ECS Cluster for agent containers
  AgentCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub cast-agents-${Stage}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Environment
          Value: !Ref Stage

  # CloudWatch Log Group for agent containers
  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/cast-agents-${Stage}
      RetentionInDays: 14

  # ECS Task Execution Role - allows ECS to pull images and write logs
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cast-ecs-execution-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cast/*

  # ECS Task Role - permissions for the running agent container
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cast-ecs-task-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AgentPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Allow agent to write logs
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AgentLogGroup.Arn

  # ECS Task Definition for claude-code agent
  AgentTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub cast-agent-${Stage}
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: agent
          Image: !Ref AgentImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: '8080'
            - Name: STAGE
              Value: !Ref Stage
            - Name: CIKADA_API_URL
              Value: !Ref CastApiUrl
            - Name: ANTHROPIC_API_KEY
              Value: !Ref AnthropicApiKey
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AgentLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: agent
      Tags:
        - Key: Environment
          Value: !Ref Stage

  # =============================================================================
  # WebSocket API Gateway
  # =============================================================================

  # WebSocket API for real-time streaming
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub cast-websocket-${Stage}
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        Environment: !Ref Stage

  # WebSocket Stage
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Stage
      AutoDeploy: true

  # $connect route - handles new WebSocket connections
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${ConnectIntegration}

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations

  # $disconnect route - handles WebSocket disconnections
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${DisconnectIntegration}

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations

  # $default route - handles all other WebSocket messages
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub integrations/${DefaultIntegration}

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDefaultFunction.Arn}/invocations

  # =============================================================================
  # WebSocket Lambda Functions
  # =============================================================================

  # Shared execution role for WebSocket Lambdas
  WebSocketFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cast-websocket-lambda-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ConnectionsTable.Arn
                  - !Sub ${ConnectionsTable.Arn}/index/*
        - PolicyName: ApiGatewayManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Stage}/*

  # $connect handler
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cast-ws-connect-${Stage}
      Handler: websocket-handlers.connectHandler
      CodeUri: dist/
      Description: WebSocket $connect handler
      Role: !GetAtt WebSocketFunctionRole.Arn
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WEBSOCKET_ENDPOINT: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
          PLANETSCALE_URL: !Ref PlanetScaleUrl
          JWT_SECRET: !Ref JwtSecret
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Format: esm
        Sourcemap: true
        EntryPoints:
          - websocket-handlers.mjs
        OutExtension:
          - .js=.mjs

  WebSocketConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$connect

  # $disconnect handler
  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cast-ws-disconnect-${Stage}
      Handler: websocket-handlers.disconnectHandler
      CodeUri: dist/
      Description: WebSocket $disconnect handler
      Role: !GetAtt WebSocketFunctionRole.Arn
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Format: esm
        Sourcemap: true
        EntryPoints:
          - websocket-handlers.mjs
        OutExtension:
          - .js=.mjs

  WebSocketDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$disconnect

  # $default handler
  WebSocketDefaultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cast-ws-default-${Stage}
      Handler: websocket-handlers.defaultHandler
      CodeUri: dist/
      Description: WebSocket $default handler
      Role: !GetAtt WebSocketFunctionRole.Arn
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WEBSOCKET_ENDPOINT: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
          PLANETSCALE_URL: !Ref PlanetScaleUrl
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Format: esm
        Sourcemap: true
        EntryPoints:
          - websocket-handlers.mjs
        OutExtension:
          - .js=.mjs

  WebSocketDefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketDefaultFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$default

  # =============================================================================
  # IAM Policies for Lambda → ECS/DynamoDB
  # =============================================================================

  # Policy for Lambda to manage ECS tasks and DynamoDB
  LambdaOrchestratorPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub cast-lambda-orchestrator-${Stage}
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # ECS permissions
          - Effect: Allow
            Action:
              - ecs:RunTask
              - ecs:StopTask
              - ecs:DescribeTasks
              - ecs:TagResource
            Resource:
              - !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/${AgentCluster}/*
              - !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/cast-agent-${Stage}:*
              - !Ref AgentTaskDefinition
          - Effect: Allow
            Action:
              - ecs:DescribeClusters
            Resource:
              - !GetAtt AgentCluster.Arn
          # Pass role to ECS
          - Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !GetAtt EcsTaskExecutionRole.Arn
              - !GetAtt EcsTaskRole.Arn
          # DynamoDB permissions for container state
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !GetAtt ContainerStateTable.Arn
              - !GetAtt ConnectionsTable.Arn
              - !Sub ${ConnectionsTable.Arn}/index/*
          # API Gateway Management API - for WebSocket broadcasts
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Stage}/*

  # Lambda execution role (referenced by policy above)
  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cast-api-lambda-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: VpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: '*'

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  ApiFunctionArn:
    Description: API Lambda Function ARN
    Value: !GetAtt ApiFunction.Arn

  # ECS Outputs
  AgentClusterArn:
    Description: ECS Cluster ARN for agent containers
    Value: !GetAtt AgentCluster.Arn
  AgentTaskDefinitionArn:
    Description: ECS Task Definition ARN
    Value: !Ref AgentTaskDefinition

  # DynamoDB Outputs
  ContainerStateTableName:
    Description: DynamoDB table for container state
    Value: !Ref ContainerStateTable
  ContainerStateTableArn:
    Description: DynamoDB table ARN for container state
    Value: !GetAtt ContainerStateTable.Arn
  ConnectionsTableName:
    Description: DynamoDB table for WebSocket connections
    Value: !Ref ConnectionsTable
  ConnectionsTableArn:
    Description: DynamoDB table ARN for WebSocket connections
    Value: !GetAtt ConnectionsTable.Arn

  # WebSocket Outputs
  WebSocketApiId:
    Description: WebSocket API ID
    Value: !Ref WebSocketApi
  WebSocketEndpoint:
    Description: WebSocket API endpoint URL
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
